<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="p_border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5AE0FF"/><stop offset="0.5" stop-color="#8F6BFF"/><stop offset="1" stop-color="#5AE0FF"/>
      <animate attributeName="x1" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="p_cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#7FB2FF"/></linearGradient>
    <radialGradient id="p_glow" cx="18%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1f3a8a" stop-opacity="0.5"/><stop offset="60%" stop-color="#04060A" stop-opacity="0"/>
    </radialGradient>
    <filter id="p_shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#5AE0FF" flood-opacity="0.28"/>
    </filter>
    <filter id="p_gl" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="p_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#5AA0FF" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>
  </defs>

  <g filter="url(#p_shadow)">
    <rect x="3" y="3" width="894" height="194" rx="18" fill="#04060A"/>
    <rect x="3" y="3" width="894" height="194" rx="18" fill="url(#p_grid)"/>
    <rect x="3" y="3" width="894" height="194" rx="18" fill="url(#p_glow)"/>
    <rect x="3.5" y="3.5" width="893" height="193" rx="17.5" fill="none" stroke="url(#p_border)" stroke-width="1.8"/>
  </g>

  <!-- reticle "0" logo -->
  <g transform="translate(100,100) scale(1.05)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#fff" stroke-width="12" filter="url(#p_gl)"/>
    <g stroke="url(#p_cy)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#p_gl)">
      <path d="M-40 -52 H-52 V-40"/><path d="M40 -52 H52 V-40"/><path d="M-40 52 H-52 V40"/><path d="M40 52 H52 V40"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
    </g>
    <g stroke="#9FE0FF" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-36" x2="0" y2="-26"/><line x1="0" y1="26" x2="0" y2="36"/><line x1="-36" y1="0" x2="-26" y2="0"/><line x1="26" y1="0" x2="36" y2="0"/>
    </g>
    <g><path d="M0 -36 A36 36 0 0 1 36 0" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#p_gl)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/></g>
    <circle cx="0" cy="0" r="6" fill="url(#p_cy)" filter="url(#p_gl)"/><circle cx="0" cy="0" r="2.6" fill="#fff"/>
  </g>

  <!-- text -->
  <text x="190" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#5AE0FF">★ FEATURED PROJECT</text>
  <text x="188" y="108" font-family="Consolas, monospace" font-weight="800" font-size="46" fill="#ffffff" filter="url(#p_gl)">probe0</text>
  <text x="190" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#B7C4EC">Open-source security scanner for AI agents — <tspan fill="#9fe0ff">find · fix · lock in CI.</tspan></text>

  <!-- chips -->
  <g font-family="Consolas, monospace" font-size="12.5" transform="translate(190,160)">
    <g><rect x="0" y="0" width="108" height="26" rx="13" fill="#0f1830" stroke="#8F6BFF" stroke-opacity="0.5"/><text x="54" y="17" fill="#c9b8ff" text-anchor="middle">Apache-2.0</text></g>
    <g transform="translate(118,0)"><rect x="0" y="0" width="112" height="26" rx="13" fill="#0f1830" stroke="#2EE59D" stroke-opacity="0.5"/><text x="56" y="17" fill="#8fffcf" text-anchor="middle">0 dependencies</text></g>
    <g transform="translate(240,0)"><rect x="0" y="0" width="92" height="26" rx="13" fill="#0f1830" stroke="#5AE0FF" stroke-opacity="0.5"/><text x="46" y="17" fill="#9fe0ff" text-anchor="middle">9 checks</text></g>
    <g transform="translate(342,0)"><rect x="0" y="0" width="128" height="26" rx="13" fill="#0f1830" stroke="#F5B800" stroke-opacity="0.5"/><text x="64" y="17" fill="#ffd766" text-anchor="middle">npm: probe0-cli</text></g>
  </g>
</svg>
