<svg width="450" height="250" viewBox="0 0 450 250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="r_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AE0FF"/><stop offset="0.5" stop-color="#8F6BFF"/><stop offset="1" stop-color="#5AE0FF"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="r_glow" cx="33%" cy="55%" r="70%"><stop offset="0" stop-color="#143a6e" stop-opacity="0.5"/><stop offset="65%" stop-color="#0A0714" stop-opacity="0"/></radialGradient>
    <linearGradient id="r_sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5AE0FF" stop-opacity="0.55"/><stop offset="1" stop-color="#5AE0FF" stop-opacity="0"/></linearGradient>
    <filter id="r_shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5AE0FF" flood-opacity="0.28"/></filter>
    <filter id="r_soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g filter="url(#r_shadow)">
    <rect x="3" y="3" width="444" height="244" rx="18" fill="#0A0714"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#r_glow)"/>
    <rect x="3.5" y="3.5" width="443" height="243" rx="17.5" fill="none" stroke="url(#r_border)" stroke-width="1.6"/>
  </g>

  <circle cx="30" cy="34" r="5" fill="#5AE0FF" filter="url(#r_soft)"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="46" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">AI Threat Coverage</text>

  <!-- radar -->
  <g transform="translate(130,145)">
    <circle r="22" fill="none" stroke="#2a3a6a" stroke-width="1"/>
    <circle r="44" fill="none" stroke="#2a3a6a" stroke-width="1"/>
    <circle r="66" fill="none" stroke="#2a3a6a" stroke-width="1"/>
    <circle r="88" fill="none" stroke="#2a3a6a" stroke-width="1"/>
    <!-- spokes -->
    <g stroke="#223055" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-88"/><line x1="0" y1="0" x2="83.7" y2="-27.2"/>
      <line x1="0" y1="0" x2="51.7" y2="71.2"/><line x1="0" y1="0" x2="-51.7" y2="71.2"/>
      <line x1="0" y1="0" x2="-83.7" y2="-27.2"/>
    </g>
    <!-- coverage polygon -->
    <polygon points="0,-83.6 71.1,-23.1 46.6,64.1 -41.4,57 -73.6,-23.9" fill="#5AE0FF" fill-opacity="0.14" stroke="#5AE0FF" stroke-width="2" filter="url(#r_soft)"/>
    <!-- rotating sweep wedge -->
    <g><path d="M0,0 L0,-88 A88,88 0 0 1 72.1,-50.5 Z" fill="url(#r_sweep)"/>
       <line x1="0" y1="0" x2="0" y2="-88" stroke="#5AE0FF" stroke-width="2" filter="url(#r_soft)"/>
       <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></g>
    <!-- vertex blips -->
    <g fill="#39d353" filter="url(#r_soft)">
      <circle cx="0" cy="-83.6" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="71.1" cy="-23.1" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="46.6" cy="64.1" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="-41.4" cy="57" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="-73.6" cy="-23.9" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="3" fill="#fff"/>
  </g>

  <!-- legend -->
  <g font-family="Consolas, monospace" font-size="12.5" fill="#C9D1D9">
    <circle cx="258" cy="86" r="4" fill="#5AE0FF"/><text x="270" y="90">Prompt injection</text>
    <circle cx="258" cy="116" r="4" fill="#8F6BFF"/><text x="270" y="120">Tool-use abuse</text>
    <circle cx="258" cy="146" r="4" fill="#39d353"/><text x="270" y="150">Secret leakage</text>
    <circle cx="258" cy="176" r="4" fill="#F5B800"/><text x="270" y="180">Insecure output</text>
    <circle cx="258" cy="206" r="4" fill="#FF5568"/><text x="270" y="210">Jailbreak / override</text>
  </g>
</svg>
