<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="a_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F6BFF"/><stop offset="0.5" stop-color="#5AE0FF"/><stop offset="1" stop-color="#8F6BFF"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="a_glow" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#3b1f8a" stop-opacity="0.5"/><stop offset="60%" stop-color="#0A0714" stop-opacity="0"/></radialGradient>
    <filter id="a_shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#8F6BFF" flood-opacity="0.3"/></filter>
    <filter id="a_neon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="a_grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0 H0 V30" fill="none" stroke="#7a5cff" stroke-width="0.5" stroke-opacity="0.08"/></pattern>
    <clipPath id="a_clip"><rect x="3" y="3" width="894" height="334" rx="18"/></clipPath>
  </defs>

  <g filter="url(#a_shadow)">
    <rect x="3" y="3" width="894" height="334" rx="18" fill="#0A0714"/>
    <rect x="3" y="3" width="894" height="334" rx="18" fill="url(#a_grid)"/>
    <rect x="3" y="3" width="894" height="334" rx="18" fill="url(#a_glow)"/>
    <rect x="3.5" y="3.5" width="893" height="333" rx="17.5" fill="none" stroke="url(#a_border)" stroke-width="1.6"/>
  </g>

  <!-- title bar -->
  <circle cx="34" cy="34" r="6" fill="#FF5F56"/>
  <circle cx="56" cy="34" r="6" fill="#FFBD2E"/>
  <circle cx="78" cy="34" r="6" fill="#27C93F"/>
  <text x="450" y="39" font-family="Consolas, monospace" font-size="13" fill="#8A7AB8" text-anchor="middle">nazil@automate-with-nazil: ~/about</text>
  <line x1="3" y1="58" x2="897" y2="58" stroke="#5b3df0" stroke-opacity="0.3" stroke-width="1"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <!-- whoami -->
    <text x="34" y="94"><tspan fill="#5AE0FF">$</tspan> <tspan fill="#c9b8ff">whoami</tspan></text>
    <text x="34" y="120" fill="#ffffff" filter="url(#a_neon)">↳ Nazil Iqbal — <tspan fill="#9fe0ff">Founder @ Automate with Nazil</tspan></text>

    <!-- mission -->
    <text x="34" y="156"><tspan fill="#5AE0FF">$</tspan> <tspan fill="#c9b8ff">cat</tspan> mission.txt</text>
    <text x="34" y="182" fill="#C9D1D9">↳ Make expensive security tools <tspan fill="#5AE0FF" font-weight="700">FREE</tspan> for everyone —</text>
    <text x="52" y="206" fill="#C9D1D9">a student in Pakistan 🇵🇰 deserves the same tools as any startup.</text>

    <!-- shipping -->
    <text x="34" y="242"><tspan fill="#5AE0FF">$</tspan> <tspan fill="#c9b8ff">ls</tspan> ~/shipping</text>
    <text x="34" y="268" fill="#C9D1D9">↳ <tspan fill="#ffffff" font-weight="700">probe0</tspan>  ·  open-source AI-agent security scanner</text>
    <text x="34" y="292" fill="#C9D1D9">↳ <tspan fill="#ffffff" font-weight="700">automate-with-nazil</tspan>  ·  AI automations · web apps · security</text>

    <!-- focus -->
    <text x="34" y="322"><tspan fill="#5AE0FF">$</tspan> <tspan fill="#c9b8ff">focus</tspan> --now <tspan fill="#8fffcf">learning in public · shipping every day</tspan><tspan fill="#5AE0FF" font-weight="700" dx="5">▋<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.05s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- neon sweep -->
  <g clip-path="url(#a_clip)">
    <rect x="-220" y="3" width="200" height="334" fill="#ffffff" opacity="0.04">
      <animate attributeName="x" values="-220;900" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
