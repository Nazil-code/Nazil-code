<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b1f8a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1a0f3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050208" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a6ff">
        <animate attributeName="stop-color" values="#c9a6ff;#8f6bff;#c9a6ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8f6bff">
        <animate attributeName="stop-color" values="#8f6bff;#c9a6ff;#8f6bff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5b3df0">
        <animate attributeName="stop-color" values="#5b3df0;#8f6bff;#5b3df0" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" rx="14" fill="#050208"/>
  <rect width="900" height="280" rx="14" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="898" height="278" rx="13" fill="none" stroke="#3b1f8a" stroke-opacity="0.6"/>

  <path d="M 40 40 L 90 40 L 120 70" stroke="#7a5cff" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7"/>
  <path d="M 860 240 L 810 240 L 780 210" stroke="#7a5cff" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7"/>

  <circle cx="120" cy="60" r="2.4" fill="#c9a6ff">
    <animate attributeName="cy" values="60;45;60" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="70" r="2" fill="#8f6bff">
    <animate attributeName="cy" values="70;90;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="220" r="1.8" fill="#c9a6ff">
    <animate attributeName="cy" values="220;200;220" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="2.2" fill="#8f6bff">
    <animate attributeName="cy" values="200;220;200" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="45" r="1.6" fill="#c9a6ff">
    <animate attributeName="cy" values="45;30;45" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="120" font-family="Consolas, 'Courier New', monospace" font-size="52"
        font-weight="700" fill="url(#titleGrad)" text-anchor="middle" filter="url(#softGlow)"
        letter-spacing="2">
    NAZIL IQBAL
  </text>

  <text x="450" y="160" font-family="Consolas, 'Courier New', monospace" font-size="18"
        fill="#d8cdfa" text-anchor="middle" opacity="1">
    Solutions Architect | AI Automation | Cybersecurity
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="160" font-family="Consolas, 'Courier New', monospace" font-size="18"
        fill="#d8cdfa" text-anchor="middle" opacity="0">
    Sales Manager • RAG Pipelines &amp; SOC Operations 🔥
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <line x1="60" y1="200" x2="840" y2="200" stroke="#5b3df0" stroke-width="1.5" opacity="0.6"/>

  <text x="450" y="192" font-family="Consolas, 'Courier New', monospace" font-size="12"
        fill="#8a7ab8" text-anchor="middle" letter-spacing="1">
    AI AUTOMATION SPECIALIST • BUILDER • PROBLEM SOLVER
  </text>
</svg>
