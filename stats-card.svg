<svg width="450" height="250" viewBox="0 0 450 250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="s_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F6BFF"/><stop offset="0.5" stop-color="#5AE0FF"/><stop offset="1" stop-color="#8F6BFF"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="s_glow" cx="30%" cy="10%" r="90%">
      <stop offset="0" stop-color="#3b1f8a" stop-opacity="0.55"/><stop offset="60%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s_num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fe0ff"/>
    </linearGradient>
    <filter id="s_neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="s_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8F6BFF" flood-opacity="0.35"/>
    </filter>
    <pattern id="s_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#7a5cff" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>
  </defs>

  <g filter="url(#s_shadow)">
    <rect x="3" y="3" width="444" height="244" rx="18" fill="#0A0714"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#s_grid)"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#s_glow)"/>
    <rect x="3.5" y="3.5" width="443" height="243" rx="17.5" fill="none" stroke="url(#s_border)" stroke-width="1.6"/>
  </g>

  <!-- header -->
  <circle cx="30" cy="34" r="5" fill="#5AE0FF" filter="url(#s_neon)"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="46" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Dev Dashboard</text>
  <text x="420" y="39" font-family="Consolas, monospace" font-size="12" fill="#8A7AB8" text-anchor="end">@Nazil-code · since 2024</text>
  <line x1="24" y1="54" x2="426" y2="54" stroke="#5b3df0" stroke-opacity="0.4" stroke-width="1"/>

  <!-- metric tiles -->
  <!-- tile 1: repos -->
  <g transform="translate(24,70)">
    <rect width="190" height="74" rx="12" fill="#120a26" fill-opacity="0.5" stroke="#8F6BFF" stroke-opacity="0.35"/>
    <text x="16" y="30" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#b7a6ff">REPOSITORIES</text>
    <text x="16" y="60" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="url(#s_num)" filter="url(#s_neon)">16</text>
    <text x="168" y="60" font-family="Consolas, monospace" font-size="20" fill="#5AE0FF" text-anchor="end">📦</text>
  </g>
  <!-- tile 2: stars -->
  <g transform="translate(236,70)">
    <rect width="190" height="74" rx="12" fill="#120a26" fill-opacity="0.5" stroke="#5AE0FF" stroke-opacity="0.35"/>
    <text x="16" y="30" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#9fe0ff">STARS EARNED</text>
    <text x="16" y="60" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="url(#s_num)" filter="url(#s_neon)">8</text>
    <text x="168" y="60" font-family="Consolas, monospace" font-size="20" fill="#F5B800" text-anchor="end">★</text>
  </g>
  <!-- tile 3: contributions -->
  <g transform="translate(24,154)">
    <rect width="190" height="74" rx="12" fill="#120a26" fill-opacity="0.5" stroke="#5AE0FF" stroke-opacity="0.35"/>
    <text x="16" y="30" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#9fe0ff">CONTRIBUTIONS</text>
    <text x="16" y="60" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="url(#s_num)" filter="url(#s_neon)">56</text>
    <text x="168" y="60" font-family="Consolas, monospace" font-size="20" fill="#5AE0FF" text-anchor="end">⚡</text>
  </g>
  <!-- tile 4: languages -->
  <g transform="translate(236,154)">
    <rect width="190" height="74" rx="12" fill="#120a26" fill-opacity="0.5" stroke="#8F6BFF" stroke-opacity="0.35"/>
    <text x="16" y="30" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#b7a6ff">LANGUAGES</text>
    <text x="16" y="60" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="url(#s_num)" filter="url(#s_neon)">6</text>
    <text x="168" y="60" font-family="Consolas, monospace" font-size="20" fill="#8F6BFF" text-anchor="end">⟨⟩</text>
  </g>
</svg>
