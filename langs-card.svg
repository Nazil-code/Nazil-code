<svg width="450" height="250" viewBox="0 0 450 250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="l_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AE0FF"/><stop offset="0.5" stop-color="#8F6BFF"/><stop offset="1" stop-color="#5AE0FF"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="l_glow" cx="70%" cy="10%" r="90%">
      <stop offset="0" stop-color="#1f5a8a" stop-opacity="0.45"/><stop offset="60%" stop-color="#0A0714" stop-opacity="0"/>
    </radialGradient>
    <filter id="l_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5AE0FF" flood-opacity="0.30"/>
    </filter>
    <filter id="l_soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="l_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#5AE0FF" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <g filter="url(#l_shadow)">
    <rect x="3" y="3" width="444" height="244" rx="18" fill="#0A0714"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#l_grid)"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#l_glow)"/>
    <rect x="3.5" y="3.5" width="443" height="243" rx="17.5" fill="none" stroke="url(#l_border)" stroke-width="1.6"/>
  </g>

  <circle cx="30" cy="34" r="5" fill="#8F6BFF" filter="url(#l_soft)"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="46" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Most Used Languages</text>
  <line x1="24" y1="54" x2="426" y2="54" stroke="#5b3df0" stroke-opacity="0.4" stroke-width="1"/>

  <g font-family="Consolas, monospace" font-size="13">
    <!-- Python 53.3 -> 248 -->
    <text x="24" y="84" fill="#C9D1D9">Python</text>
    <rect x="118" y="76" width="248" height="11" rx="5.5" fill="#1b1430"/>
    <rect x="118" y="76" width="0" height="11" rx="5.5" fill="#4B8BBE" filter="url(#l_soft)"><animate attributeName="width" from="0" to="248" dur="1.3s" begin="0.1s" fill="freeze"/></rect>
    <text x="424" y="84" fill="#9fe0ff" text-anchor="end">53.3%</text>

    <!-- HTML 22.1 -> 103 -->
    <text x="24" y="118" fill="#C9D1D9">HTML</text>
    <rect x="118" y="110" width="248" height="11" rx="5.5" fill="#1b1430"/>
    <rect x="118" y="110" width="0" height="11" rx="5.5" fill="#E34F26" filter="url(#l_soft)"><animate attributeName="width" from="0" to="103" dur="1.3s" begin="0.2s" fill="freeze"/></rect>
    <text x="424" y="118" fill="#9fe0ff" text-anchor="end">22.1%</text>

    <!-- JS 14.9 -> 69 -->
    <text x="24" y="152" fill="#C9D1D9">JavaScript</text>
    <rect x="118" y="144" width="248" height="11" rx="5.5" fill="#1b1430"/>
    <rect x="118" y="144" width="0" height="11" rx="5.5" fill="#F7DF1E" filter="url(#l_soft)"><animate attributeName="width" from="0" to="69" dur="1.3s" begin="0.3s" fill="freeze"/></rect>
    <text x="424" y="152" fill="#9fe0ff" text-anchor="end">14.9%</text>

    <!-- TS 8.1 -> 38 -->
    <text x="24" y="186" fill="#C9D1D9">TypeScript</text>
    <rect x="118" y="178" width="248" height="11" rx="5.5" fill="#1b1430"/>
    <rect x="118" y="178" width="0" height="11" rx="5.5" fill="#3178C6" filter="url(#l_soft)"><animate attributeName="width" from="0" to="38" dur="1.3s" begin="0.4s" fill="freeze"/></rect>
    <text x="424" y="186" fill="#9fe0ff" text-anchor="end">8.1%</text>

    <!-- C++ 1.4 -> 8 -->
    <text x="24" y="220" fill="#C9D1D9">C++</text>
    <rect x="118" y="212" width="248" height="11" rx="5.5" fill="#1b1430"/>
    <rect x="118" y="212" width="0" height="11" rx="5.5" fill="#f34b7d" filter="url(#l_soft)"><animate attributeName="width" from="0" to="8" dur="1.3s" begin="0.5s" fill="freeze"/></rect>
    <text x="424" y="220" fill="#9fe0ff" text-anchor="end">1.4%</text>
  </g>
</svg>
