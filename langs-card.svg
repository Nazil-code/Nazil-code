<svg width="450" height="250" viewBox="0 0 450 250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="l_border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AE0FF"/><stop offset="0.5" stop-color="#8F6BFF"/><stop offset="1" stop-color="#5AE0FF"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="l_glow" cx="70%" cy="10%" r="90%">
      <stop offset="0" stop-color="#1f5a8a" stop-opacity="0.45"/><stop offset="60%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="l_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5AE0FF" flood-opacity="0.30"/>
    </filter>
    <filter id="l_soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="l_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#5AE0FF" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <g filter="url(#l_shadow)">
    <rect x="3" y="3" width="444" height="244" rx="18" fill="#0A0714"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#l_grid)"/>
    <rect x="3" y="3" width="444" height="244" rx="18" fill="url(#l_glow)"/>
    <rect x="3.5" y="3.5" width="443" height="243" rx="17.5" fill="none" stroke="url(#l_border)" stroke-width="1.6"/>
  </g>

  <circle cx="30" cy="34" r="5" fill="#8F6BFF" filter="url(#l_soft)"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="46" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Most Used Languages</text>
  <line x1="24" y1="54" x2="426" y2="54" stroke="#5b3df0" stroke-opacity="0.4" stroke-width="1"/>

  <!-- rows: name | track | bar | pct -->
  <g font-family="Consolas, monospace" font-size="13">
    <!-- Python 53.3 -> 258 -->
    <g transform="translate(24,76)">
      <text x="0" y="4" fill="#C9D1D9">Python</text>
      <rect x="92" y="-8" width="262" height="12" rx="6" fill="#1b1430"/>
      <rect x="92" y="-8" width="0" height="12" rx="6" fill="#3776AB" filter="url(#l_soft)"><animate attributeName="width" from="0" to="258" dur="1.3s" begin="0.1s" fill="freeze"/></rect>
      <text x="426" y="4" fill="#9fe0ff" text-anchor="end">53.3%</text>
    </g>
    <!-- HTML 22.1 -> 108 -->
    <g transform="translate(24,110)">
      <text x="0" y="4" fill="#C9D1D9">HTML</text>
      <rect x="92" y="-8" width="262" height="12" rx="6" fill="#1b1430"/>
      <rect x="92" y="-8" width="0" height="12" rx="6" fill="#E34F26" filter="url(#l_soft)"><animate attributeName="width" from="0" to="108" dur="1.3s" begin="0.2s" fill="freeze"/></rect>
      <text x="426" y="4" fill="#9fe0ff" text-anchor="end">22.1%</text>
    </g>
    <!-- JS 14.9 -> 73 -->
    <g transform="translate(24,144)">
      <text x="0" y="4" fill="#C9D1D9">JavaScript</text>
      <rect x="92" y="-8" width="262" height="12" rx="6" fill="#1b1430"/>
      <rect x="92" y="-8" width="0" height="12" rx="6" fill="#F7DF1E" filter="url(#l_soft)"><animate attributeName="width" from="0" to="73" dur="1.3s" begin="0.3s" fill="freeze"/></rect>
      <text x="426" y="4" fill="#9fe0ff" text-anchor="end">14.9%</text>
    </g>
    <!-- TS 8.1 -> 40 -->
    <g transform="translate(24,178)">
      <text x="0" y="4" fill="#C9D1D9">TypeScript</text>
      <rect x="92" y="-8" width="262" height="12" rx="6" fill="#1b1430"/>
      <rect x="92" y="-8" width="0" height="12" rx="6" fill="#3178C6" filter="url(#l_soft)"><animate attributeName="width" from="0" to="40" dur="1.3s" begin="0.4s" fill="freeze"/></rect>
      <text x="426" y="4" fill="#9fe0ff" text-anchor="end">8.1%</text>
    </g>
    <!-- C++ 1.4 -> 8 -->
    <g transform="translate(24,212)">
      <text x="0" y="4" fill="#C9D1D9">C++</text>
      <rect x="92" y="-8" width="262" height="12" rx="6" fill="#1b1430"/>
      <rect x="92" y="-8" width="0" height="12" rx="6" fill="#f34b7d" filter="url(#l_soft)"><animate attributeName="width" from="0" to="9" dur="1.3s" begin="0.5s" fill="freeze"/></rect>
      <text x="426" y="4" fill="#9fe0ff" text-anchor="end">1.4%</text>
    </g>
  </g>
</svg>
